[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["rornic"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rornic/rustcraft"

[workspace.dependencies]
ochre-base = { path = "crates/ochre-base" }
ochre-terrain = { path = "crates/ochre-terrain" }
ochre-world = { path = "crates/ochre-world" }
ochre-gameplay = { path = "crates/ochre-gameplay" }
noise = "0.9.0"
rand = "0.10"
toml = "1"
serde = { version = "1.0", features = ["serde_derive"] }
# the default features minus wayland, which needs system libs we don't have
bevy = { version = "0.20", default-features = false, features = [
    "trace", "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    "std", "bevy_gilrs", "bevy_winit", "bevy_clipboard", "audio", "default_font", "multi_threaded", "x11", "custom_cursor",
    "common_api", "3d_bevy_render", "ui_api", "ui_bevy_render", "bevy_ui_widgets",
] }
tracing = { version = "0.1.40", features = ["attributes"] }
criterion = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

# The engine: re-exports the ochre crates, and holds the examples and benchmarks.
[package]
name = "ochre-engine"
description = "A planetary voxel engine for Bevy"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ochre-base.workspace = true
ochre-terrain.workspace = true
ochre-world.workspace = true
ochre-gameplay.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
bevy.workspace = true
criterion.workspace = true
image.workspace = true

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.objc2]
debug-assertions = false

[[bench]]
name = "terrain"
harness = false
