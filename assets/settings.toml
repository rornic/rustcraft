[renderer]
render_distance = 512
full_detail_distance = 16
lod_level_scale = 4
lod_fade_seconds = 1.5

# Switches for an A/B frame-rate test, e.g. standing in a forest. Leave them off to play.
[debug]
# Leaves stop swaying in the wind. A big gain here would point at the sway itself.
still_leaves = false
# Leaves are drawn solid, without the holes cut in them, in their shadows too, and hide the
# leaves behind them, so a canopy is drawn as just its outer shell. A big gain here and none
# from still_leaves would confirm the cost is overdraw between layers of leaves.
solid_leaves = false
