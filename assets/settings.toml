[renderer]
render_distance = 1024
full_detail_distance = 12
lod_level_scale = 2
lod_base_distance = 16
lod_fade_seconds = 1.5
shadow_distance = 64
shadow_cascades = 3
# low, medium, high or ultra; the cloud target height follows the window's aspect ratio.
cloud_resolution = "medium"

[debug]
still_leaves = false
solid_leaves = false

[world]
size = 65536
map_cell = 32

[world.bounds]
min_y = -1024
max_y = 2048

[world.tectonics]
plates = 12
relief = 1.0

[world.climate]
# Regional sea-level warmth (0..1); wind points in the direction air travels.
warmth = 0.68
wind_x = 1.0
wind_z = 0.15
